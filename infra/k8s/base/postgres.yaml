# PostgreSQL run by the CloudNativePG operator (SPEC §12 D14), with continuous backup through the Barman Cloud
# plugin: every WAL segment plus a daily base backup go to the `backups` object store, kept 14 days (SPEC §10).
# The operator creates the Secret `postgres-app` (key `uri` = DATABASE_URL for the owner `toasthub`).
# Restore and point-in-time recovery: docs/DEPLOY.md.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  # One instance fits one node. A second one would be a hot standby with automatic failover.
  instances: 1
  # Keep the major version in step with infra/docker/docker-compose.yml. The minimal image is enough: the
  # plugin's sidecar does the archiving.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
  bootstrap:
    initdb:
      database: toasthub
      owner: toasthub
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backups
---
# Where backups go. The overlay sets the bucket (destinationPath) and the endpoint; credentials are the
# `toasthub-backup` Secret.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: backups
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://toasthub-backups/
    s3Credentials:
      accessKeyId:
        name: toasthub-backup
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: toasthub-backup
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-daily
spec:
  # Six fields (seconds first), in the operator's time zone (UTC): 02:30 every day.
  schedule: '0 30 2 * * *'
  # Also one right away, so a new cluster can be restored before its first night.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
