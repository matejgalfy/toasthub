# The SPA on nginx (infra/docker/web.Dockerfile). The ingress sends /api straight to the api; nginx's own /api
# proxy (API_UPSTREAM) is only a fallback here, but the name must resolve or nginx won't start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: toasthub
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: toasthub
      app.kubernetes.io/component: web
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toasthub
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # `nginx` in nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: toasthub-web
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: http://api:3000
            # CSP img-src: photos are presigned URLs on the S3 endpoint (path style).
            - name: PHOTO_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: toasthub-config
                  key: S3_ENDPOINT
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The entrypoint renders the config templates into conf.d at start; nginx keeps its pid and
          # buffers in /tmp.
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: toasthub
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: toasthub
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
