# Production: k3s with Traefik on the VM it shares with FitBond, TLS from cert-manager (Let's Encrypt), photos
# and backups in the in-cluster MinIO, mail through Resend (SPEC §12 D63). The secrets come from
# infra/k8s/seal-secrets.sh; deploy.sh refuses to run while a placeholder is left. Images: deploy.sh sets the
# tag (the commit SHA). docs/DEPLOY.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: toasthub

resources:
  - ../../base
  - ../../minio
  - sealed-secrets.yaml
  - middlewares.yaml
  - s3-ingress.yaml

configMapGenerator:
  - name: toasthub-config
    behavior: merge
    literals:
      - BETTER_AUTH_URL=https://toasthub.live
      - WEB_ORIGIN=https://toasthub.live
      # Only these email domains can sign in (SPEC BR-AUTH-6, D66).
      - ALLOWED_EMAIL_DOMAINS=gmail.com,muni.cz,mail.muni.cz
      # The domain verified in Resend.
      - MAIL_FROM=Toasthub <toasthub@fitbond.me>
      # MinIO through its own Ingress (s3-ingress.yaml): browsers load the presigned photo URLs from it, and the
      # api uploads to the same host, since a URL only works on the host it was signed for.
      - S3_ENDPOINT=https://s3.toasthub.live

# One pod each: the 4 GB VM also runs FitBond. maxUnavailable 0 still keeps a deploy free of downtime.
replicas:
  - name: api
    count: 1
  - name: web
    count: 1

patches:
  - target:
      kind: Ingress
      name: toasthub
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/cluster-issuer: letsencrypt
          # <namespace>-<name>@kubernetescrd, see middlewares.yaml.
          traefik.ingress.kubernetes.io/router.middlewares: toasthub-https-redirect@kubernetescrd,toasthub-hsts@kubernetescrd
      - op: add
        path: /spec/tls
        value:
          - hosts: [toasthub.live]
            secretName: toasthub-tls
      - op: add
        path: /spec/rules/0/host
        value: toasthub.live
  - target:
      kind: PersistentVolumeClaim
      name: minio-data
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  # Backups stay inside the cluster; copy the bucket off the VM now and then (docs/DEPLOY.md).
  - target:
      kind: ObjectStore
      name: backups
    patch: |-
      - op: add
        path: /spec/configuration/endpointURL
        value: http://minio:9000
