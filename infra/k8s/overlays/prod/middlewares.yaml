# Traefik middlewares for the app's Ingress (k3s's bundled Traefik, SPEC §12 D60).
# HTTP → HTTPS. Requests that already arrive over HTTPS pass through unchanged.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# HSTS belongs to the TLS terminator, not the web image (SPEC §12 D59). One year, this host only.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts
spec:
  headers:
    stsSeconds: 31536000
