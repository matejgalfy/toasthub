# Templates: replace this whole file with the output of infra/k8s/seal-secrets.sh (docs/DEPLOY.md), which
# encrypts the values for the prod cluster's Sealed Secrets key, then commit it (SPEC §12 D15). Only that
# cluster can decrypt them. deploy.sh refuses to run while a placeholder is left.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: toasthub-app
  namespace: toasthub
spec:
  encryptedData:
    BETTER_AUTH_SECRET: REPLACE_ME
    SMTP_URL: REPLACE_ME
    S3_ACCESS_KEY_ID: REPLACE_ME
    S3_SECRET_ACCESS_KEY: REPLACE_ME
  template:
    metadata:
      name: toasthub-app
      namespace: toasthub
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: toasthub-backup
  namespace: toasthub
spec:
  encryptedData:
    ACCESS_KEY_ID: REPLACE_ME
    ACCESS_SECRET_KEY: REPLACE_ME
  template:
    metadata:
      name: toasthub-backup
      namespace: toasthub
