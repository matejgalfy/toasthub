# MinIO (presigned photo URLs) and the Mailpit UI on their own *.localhost hosts, next to the app.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-tools
spec:
  rules:
    - host: minio.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  name: s3
    - host: mailpit.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port:
                  name: http
