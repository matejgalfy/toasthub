# Included in every location that sets its own headers: nginx drops the server's add_header lines there.
# ${PHOTO_ORIGIN} is the S3 endpoint the presigned photo URLs point at (S3_ENDPOINT, or the bucket's origin).
# style-src needs 'unsafe-inline': sonner and Radix inject <style> elements at runtime.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${PHOTO_ORIGIN}; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
