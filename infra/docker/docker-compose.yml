# Local dev services. Start with `docker compose -f infra/docker/docker-compose.yml up -d`.
# Credentials here are for local use only and match apps/api/.env.example.
name: toasthub

services:
  postgres:
    # Keep in step with POSTGRES_IMAGE in apps/api/test/global-setup.ts.
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: toasthub
      POSTGRES_PASSWORD: toasthub
      POSTGRES_DB: toasthub
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep PGDATA in a versioned folder below /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U toasthub -d toasthub']
      interval: 2s
      timeout: 5s
      retries: 15

  minio:
    # Community build of MinIO; upstream stopped publishing images (SPEC §12 D23).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: toasthub
      MINIO_ROOT_PASSWORD: toasthub-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 5s
      retries: 15

  # One-shot: creates the photo bucket, then exits.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 toasthub toasthub-secret &&
             mc mb --ignore-existing local/toasthub-photos"
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI and API

volumes:
  postgres-data:
  minio-data:
