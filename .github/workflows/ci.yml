name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, build, OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

      # `bun run openapi` also regenerates the web client from it.
      - name: OpenAPI and web client are up to date
        run: |
          bun run openapi
          git diff --exit-code apps/api/openapi.json apps/web/src/api/schema.gen.ts \
            || (echo "::error::openapi.json or the web client is stale. Run 'bun run openapi' and commit both." && exit 1)

      - uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: apps/api/openapi.json

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      # Integration tests start Postgres through Testcontainers on the runner's Docker.
      - run: bun run test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      # Only the services the tests use so far; add minio once a test uploads a photo (M8).
      - run: docker compose -f infra/docker/docker-compose.yml up -d --wait postgres mailpit
      - run: cp apps/api/.env.example apps/api/.env
      - run: bun run db:migrate
      - run: bunx playwright install --with-deps chromium
        working-directory: e2e
      # Builds the api, then Playwright starts it and the Vite dev server.
      - run: bun run e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
